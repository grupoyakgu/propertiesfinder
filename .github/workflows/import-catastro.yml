name: Import Catastro Parcels

# Manually-triggered import of official Catastro cadastral parcels into the
# production database. Runs on GitHub's hosted runners, which have normal
# internet access to catastro.hacienda.gob.es (unlike some sandboxed dev
# environments), so this is the easiest way to run the import without a
# local terminal.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   DATABASE_URL        - the production Supabase Transaction pooler
#                          connection string (port 6543), same one the app
#                          uses at runtime.
#   DIRECT_DATABASE_URL - the SAME connection string but with the port
#                          changed to 5432 (Supabase's Session pooler mode
#                          on the same host). `prisma migrate deploy` needs
#                          this: transaction-mode PgBouncer (6543) can't
#                          reliably hold the locks migrations require and
#                          will hang indefinitely rather than fail cleanly.

on:
  workflow_dispatch:
    inputs:
      province:
        description: "Province name (as it appears in the Catastro ATOM feed)"
        required: true
        default: "Sevilla"
      municipality:
        description: "Municipality name"
        required: true
        default: "Sevilla"
      limit:
        description: "Limit number of parcels (leave blank for full import; use 25 for a smoke test)"
        required: false
        default: "25"
      inspectUrl:
        description: "Debug only: a GML zip URL to dump raw structure for (skips the DB import entirely when set)"
        required: false
        default: ""
      baselineMigration:
        description: "One-time only: name of an existing migration to mark as already-applied (e.g. when the DB has tables from before Prisma tracked migrations). Leave blank normally."
        required: false
        default: ""

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Baseline existing migration (one-time)
        if: ${{ inputs.inspectUrl == '' && inputs.baselineMigration != '' }}
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx prisma migrate resolve --applied "${{ inputs.baselineMigration }}"

      - name: Apply pending Prisma migrations
        if: ${{ inputs.inspectUrl == '' }}
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Inspect GML structure (debug)
        if: ${{ inputs.inspectUrl != '' }}
        run: npx tsx scripts/import-catastro-parcels.ts --inspect "${{ inputs.inspectUrl }}"

      - name: Run Catastro import
        if: ${{ inputs.inspectUrl == '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            npx tsx scripts/import-catastro-parcels.ts \
              --province "${{ inputs.province }}" \
              --municipality "${{ inputs.municipality }}" \
              --limit "${{ inputs.limit }}"
          else
            npx tsx scripts/import-catastro-parcels.ts \
              --province "${{ inputs.province }}" \
              --municipality "${{ inputs.municipality }}"
          fi
